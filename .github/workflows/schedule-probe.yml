# TEMPORARY DIAGNOSTIC — delete once the question below is answered.
#
# Daily Quote's schedule has stopped being delivered: four consecutive
# scheduled events dropped (2026-08-27 05:00, 2026-08-28 05:17, 13:17 and a
# 13:57 probe pushed 14 minutes ahead), while every workflow_dispatch in the
# same window started within seconds.
#
# That leaves one question this file exists to answer: is schedule delivery
# broken for the blank.yml workflow specifically, or for the whole repository?
# This is a brand new file, so it gets a new workflow id and fresh scheduler
# state. If this fires and blank.yml still does not, the daily job can simply
# be moved to a new file. If this never fires either, the repository cannot be
# scheduled at all and only an external trigger will do.
#
# Deliberately does nothing: no secrets, no token permissions, no publishing.
# Runs every 15 minutes so the answer arrives in minutes rather than days.
name: Schedule Probe

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report that the trigger arrived
        run: |
          echo "Schedule probe fired."
          echo "  event:     ${{ github.event_name }}"
          echo "  utc now:   $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
